<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Integrated Management System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React, ReactDOM, Babel for single-file browser runtime -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons Global Library -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- Lucide Icon Wrapper Component ---
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      const [svgContent, setSvgContent] = useState("");

      useEffect(() => {
        if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
          const iconElement = window.lucide.createElement(window.lucide.icons[name]);
          setSvgContent(iconElement.outerHTML);
        }
      }, [name]);

      if (!svgContent) {
        return <span class={`inline-block ${className}`} {...props}></span>;
      }

      return (
        <span 
          className={`inline-flex items-center justify-center ${className}`}
          dangerouslySetInnerHTML={{ __html: svgContent }}
          {...props}
        />
      );
    };

    // --- MOCK INITIAL DATA SETS ---
    const initialStudents = [
      { id: 'STU001', name: 'Alex Johnson', email: 'alex.j@campus.edu', department: 'Computer Science', year: '3rd Year', gpa: '3.8', status: 'Active' },
      { id: 'STU002', name: 'Sophia Chen', email: 'sophia.c@campus.edu', department: 'Electrical Eng.', year: '2nd Year', gpa: '3.9', status: 'Active' },
      { id: 'STU003', name: 'Marcus Vance', email: 'm.vance@campus.edu', department: 'Mechanical Eng.', year: '4th Year', gpa: '3.4', status: 'On Leave' },
      { id: 'STU004', name: 'Emily Davis', email: 'e.davis@campus.edu', department: 'Biotechnology', year: '1st Year', gpa: '3.6', status: 'Active' }
    ];

    const initialFaculty = [
      { id: 'FAC101', name: 'Dr. Robert Smith', email: 'r.smith@campus.edu', department: 'Computer Science', designation: 'Professor', specialization: 'AI & Data Structures' },
      { id: 'FAC102', name: 'Prof. Elena Rostova', email: 'e.rostova@campus.edu', department: 'Electrical Eng.', designation: 'Associate Professor', specialization: 'Embedded Systems' },
      { id: 'FAC103', name: 'Dr. Michael Chang', email: 'm.chang@campus.edu', department: 'Biotechnology', designation: 'Assistant Professor', specialization: 'Genomics' }
    ];

    const initialCourses = [
      { id: 'CS301', title: 'Data Structures & Algorithms', faculty: 'Dr. Robert Smith', credits: 4, enrolled: 45, status: 'Active', assignments: 5 },
      { id: 'EE204', title: 'Microcontrollers & IoT', faculty: 'Prof. Elena Rostova', credits: 3, enrolled: 38, status: 'Active', assignments: 3 },
      { id: 'BIO102', title: 'Intro to Computational Biology', faculty: 'Dr. Michael Chang', credits: 4, enrolled: 29, status: 'Upcoming', assignments: 2 }
    ];

    const initialResources = [
      { id: 'RES-01', name: 'Main Auditorium (Room 101)', category: 'Classrooms', capacity: 250, status: 'Available', specs: 'Projector, Dolby Audio' },
      { id: 'RES-02', name: 'Advanced Robotics Lab', category: 'Laboratories', capacity: 30, status: 'Occupied', specs: '3D Printers, Robotic Arms' },
      { id: 'RES-03', name: 'High-Performance GPU Cluster', category: 'Equipment', capacity: 8, status: 'Available', specs: '4x NVIDIA A100 Nodes' },
      { id: 'RES-04', name: 'Physics Optics Lab 2B', category: 'Laboratories', capacity: 25, status: 'Maintenance', specs: 'Laser Test Benches' }
    ];

    const initialActivities = [
      { id: 'ACT-01', name: 'Annual Hackathon 2026', date: '2026-11-15', time: '09:00 AM', venue: 'Main Auditorium', organizer: 'CS Club', status: 'Confirmed' },
      { id: 'ACT-02', name: 'Guest Lecture: Quantum Computing', date: '2026-11-18', time: '02:00 PM', venue: 'Hall B', organizer: 'Physics Dept', status: 'Upcoming' },
      { id: 'ACT-03', name: 'Inter-Department Robotics Cup', date: '2026-11-22', time: '10:00 AM', venue: 'Robotics Lab', organizer: 'Robotics Club', status: 'Planning' }
    ];

    function App() {
      // Navigation & Role State
      const [currentRole, setCurrentRole] = useState('Admin'); // Admin, Faculty, Staff, Student
      const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, students, faculty, courses, resources, activities, bookings, architecture
      
      // Data State
      const [students, setStudents] = useState(initialStudents);
      const [faculty, setFaculty] = useState(initialFaculty);
      const [courses, setCourses] = useState(initialCourses);
      const [resources, setResources] = useState(initialResources);
      const [activities, setActivities] = useState(initialActivities);

      // Search & Filter States
      const [searchQuery, setSearchQuery] = useState('');
      
      // Modal Handling
      const [modalType, setModalType] = useState(null); // 'addStudent', 'addFaculty'
      const [selectedResource, setSelectedResource] = useState(null);
      
      // Booking Form State
      const [bookingDetails, setBookingDetails] = useState({ resourceId: '', user: '', date: '', timeSlot: '' });
      const [bookingStatusMsg, setBookingStatusMsg] = useState(null);

      // Form input states
      const [newStudent, setNewStudent] = useState({ name: '', email: '', department: 'Computer Science', year: '1st Year', gpa: '3.5', status: 'Active' });
      const [newFaculty, setNewFaculty] = useState({ name: '', email: '', department: 'Computer Science', designation: 'Assistant Professor', specialization: '' });

      // Handle Add Student
      const handleAddStudent = (e) => {
        e.preventDefault();
        const created = {
          ...newStudent,
          id: `STU00${students.length + 1}`
        };
        setStudents([...students, created]);
        setModalType(null);
        setNewStudent({ name: '', email: '', department: 'Computer Science', year: '1st Year', gpa: '3.5', status: 'Active' });
      };

      // Handle Add Faculty
      const handleAddFaculty = (e) => {
        e.preventDefault();
        const created = {
          ...newFaculty,
          id: `FAC10${faculty.length + 1}`
        };
        setFaculty([...faculty, created]);
        setModalType(null);
        setNewFaculty({ name: '', email: '', department: 'Computer Science', designation: 'Assistant Professor', specialization: '' });
      };

      // Handle Resource Booking Simulation
      const handleSimulateBooking = (e) => {
        e.preventDefault();
        const targetRes = resources.find(r => r.id === bookingDetails.resourceId);
        if (!targetRes) return;

        if (targetRes.status === 'Occupied' || targetRes.status === 'Maintenance') {
          setBookingStatusMsg({ type: 'error', text: `Conflict Detected! ${targetRes.name} is currently ${targetRes.status.toLowerCase()}.` });
        } else {
          // Simulate successful booking & state update
          setResources(resources.map(r => r.id === targetRes.id ? { ...r, status: 'Occupied' } : r));
          setBookingStatusMsg({ type: 'success', text: `Success! Reserved ${targetRes.name} for ${bookingDetails.user || 'Requested User'}.` });
          setTimeout(() => {
            setModalType(null);
            setBookingStatusMsg(null);
          }, 1500);
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col md:flex-row">
          
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-full md:w-72 bg-slate-900 text-slate-100 flex-shrink-0 flex flex-col justify-between border-r border-slate-800">
            <div>
              {/* Logo Header */}
              <div className="p-6 border-b border-slate-800 flex items-center space-x-3">
                <div className="p-2.5 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-600/30">
                  <Icon name="layers-3" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight text-white">SmartCampus</h1>
                  <p className="text-xs text-slate-400 font-medium">Integrated Management</p>
                </div>
              </div>

              {/* User Role Selector Header */}
              <div className="p-4 mx-4 my-4 bg-slate-800/80 rounded-xl border border-slate-700/60">
                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Active Role Portal</label>
                <div className="grid grid-cols-2 gap-1.5 bg-slate-900 p-1 rounded-lg border border-slate-700/50 text-xs font-medium">
                  {['Admin', 'Staff', 'Faculty', 'Student'].map((role) => (
                    <button
                      key={role}
                      onClick={() => setCurrentRole(role)}
                      className={`py-1.5 px-2 rounded-md text-center transition-all ${
                        currentRole === role 
                          ? 'bg-indigo-600 text-white shadow-sm font-semibold' 
                          : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                      }`}
                    >
                      {role}
                    </button>
                  ))}
                </div>
              </div>

              {/* Main Navigation Menu */}
              <nav className="px-3 space-y-1">
                <div className="px-3 pb-2 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Core Modules</div>
                
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'dashboard' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-800/60'
                  }`}
                >
                  <Icon name="activity" className="w-4 h-4" />
                  <span>Dashboard Overview</span>
                </button>

                <button
                  onClick={() => setActiveTab('students')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'students' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'text-slate-300 hover:bg-slate-800/60'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="users" className="w-4 h-4 text-blue-400" />
                    <span>Student Management</span>
                  </div>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{students.length}</span>
                </button>

                <button
                  onClick={() => setActiveTab('faculty')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'faculty' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'text-slate-300 hover:bg-slate-800/60'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="user-check" className="w-4 h-4 text-rose-400" />
                    <span>Faculty Management</span>
                  </div>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{faculty.length}</span>
                </button>

                <button
                  onClick={() => setActiveTab('courses')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'courses' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'text-slate-300 hover:bg-slate-800/60'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="book-open" className="w-4 h-4 text-amber-400" />
                    <span>Course Management</span>
                  </div>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{courses.length}</span>
                </button>

                <button
                  onClick={() => setActiveTab('resources')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'resources' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-300 hover:bg-slate-800/60'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="flask-conical" className="w-4 h-4 text-emerald-400" />
                    <span>Resource Management</span>
                  </div>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{resources.length}</span>
                </button>

                <button
                  onClick={() => setActiveTab('activities')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'activities' ? 'bg-purple-500/20 text-purple-400 border border-purple-500/30' : 'text-slate-300 hover:bg-slate-800/60'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="calendar" className="w-4 h-4 text-purple-400" />
                    <span>Campus Activities</span>
                  </div>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{activities.length}</span>
                </button>

                <button
                  onClick={() => setActiveTab('bookings')}
                  className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'bookings' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/30' : 'text-slate-300 hover:bg-slate-800/60'
                  }`}
                >
                  <Icon name="clock" className="w-4 h-4 text-orange-400" />
                  <span>Resource Booking System</span>
                </button>

                <div className="pt-4 px-3 pb-2 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Architecture</div>

                <button
                  onClick={() => setActiveTab('architecture')}
                  className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'architecture' ? 'bg-indigo-600/30 text-indigo-300 border border-indigo-500/40' : 'text-slate-300 hover:bg-slate-800/60'
                  }`}
                >
                  <Icon name="code" className="w-4 h-4 text-indigo-400" />
                  <span>Java Stack Blueprint</span>
                </button>
              </nav>
            </div>

            {/* User Info Footer */}
            <div className="p-4 border-t border-slate-800 bg-slate-900/60">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white text-sm">
                    {currentRole[0]}
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-white leading-none">{currentRole} Mode</p>
                    <p className="text-xs text-slate-400 mt-1">Access: Full Privileges</p>
                  </div>
                </div>
                <Icon name="shield" className="w-4 h-4 text-slate-500" />
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT WORKSPACE */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            {/* TOP BAR / HEADER */}
            <header className="bg-white border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 sticky top-0 z-10 shadow-sm">
              <div>
                <h2 className="text-xl font-bold text-slate-900 capitalize flex items-center gap-2">
                  {activeTab.replace('-', ' ')}
                  <span className="text-xs px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium border border-slate-200">
                    Java App View
                  </span>
                </h2>
                <p className="text-xs text-slate-500 mt-0.5">Smart Campus Integrated Management System Controller</p>
              </div>

              <div className="flex items-center space-x-3">
                {/* Global Search */}
                <div className="relative w-full sm:w-64">
                  <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Search resources, users, logs..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                  />
                </div>
              </div>
            </header>

            {/* DASHBOARD CONTENT CONTAINER */}
            <div className="p-6 space-y-6 max-w-7xl mx-auto w-full">
              
              {/* 1. OVERVIEW DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  {/* Architecture Highlight Banner */}
                  <div className="bg-gradient-to-r from-indigo-900 via-slate-900 to-slate-800 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
                    <div className="absolute right-0 top-0 bottom-0 w-1/3 opacity-10 bg-repeat pointer-events-none" style={{ backgroundImage: 'radial-gradient(#fff 1px, transparent 1px)', backgroundSize: '16px 16px' }}></div>
                    <div className="max-w-2xl relative z-10">
                      <span className="px-3 py-1 bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-xs font-semibold rounded-full uppercase tracking-wider">System Architecture Online</span>
                      <h3 className="text-2xl font-bold mt-3 text-white">Smart Campus Integrated Management System</h3>
                      <p className="text-slate-300 text-sm mt-2 leading-relaxed">
                        Powered by a menu-driven Java architecture with OOP principles, Collections & Streams processing, and JDBC database persistency layer.
                      </p>
                      <div className="mt-4 flex flex-wrap gap-3">
                        <button onClick={() => setActiveTab('bookings')} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition-all shadow-md">
                          Launch Booking System
                        </button>
                        <button onClick={() => setActiveTab('architecture')} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold rounded-lg transition-all">
                          View Java Diagram Spec
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Functional Summary Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                    {/* Student Blue Card */}
                    <div 
                      onClick={() => setActiveTab('students')}
                      className="bg-blue-50/70 border border-blue-200/80 rounded-xl p-4 hover:shadow-md transition-all cursor-pointer group"
                    >
                      <div className="flex justify-between items-start">
                        <div className="p-2 bg-blue-500 text-white rounded-lg shadow-sm group-hover:scale-105 transition-transform">
                          <Icon name="users" className="w-5 h-5" />
                        </div>
                        <span className="text-xs font-semibold text-blue-700 bg-blue-100 px-2 py-0.5 rounded-full">Active</span>
                      </div>
                      <p className="text-2xl font-bold text-slate-800 mt-3">{students.length}</p>
                      <p className="text-xs font-medium text-slate-600">Student Records</p>
                      <div className="mt-3 pt-2 border-t border-blue-100 flex items-center justify-between text-[11px] text-blue-700 font-medium">
                        <span>Add, View, Search, Update</span>
                        <Icon name="chevron-right" className="w-3 h-3" />
                      </div>
                    </div>

                    {/* Faculty Red/Pink Card */}
                    <div 
                      onClick={() => setActiveTab('faculty')}
                      className="bg-rose-50/70 border border-rose-200/80 rounded-xl p-4 hover:shadow-md transition-all cursor-pointer group"
                    >
                      <div className="flex justify-between items-start">
                        <div className="p-2 bg-rose-500 text-white rounded-lg shadow-sm group-hover:scale-105 transition-transform">
                          <Icon name="user-check" className="w-5 h-5" />
                        </div>
                        <span className="text-xs font-semibold text-rose-700 bg-rose-100 px-2 py-0.5 rounded-full">Faculty</span>
                      </div>
                      <p className="text-2xl font-bold text-slate-800 mt-3">{faculty.length}</p>
                      <p className="text-xs font-medium text-slate-600">Faculty Members</p>
                      <div className="mt-3 pt-2 border-t border-rose-100 flex items-center justify-between text-[11px] text-rose-700 font-medium">
                        <span>Add, View, Search, Update</span>
                        <Icon name="chevron-right" className="w-3 h-3" />
                      </div>
                    </div>

                    {/* Course Yellow Card */}
                    <div 
                      onClick={() => setActiveTab('courses')}
                      className="bg-amber-50/70 border border-amber-200/80 rounded-xl p-4 hover:shadow-md transition-all cursor-pointer group"
                    >
                      <div className="flex justify-between items-start">
                        <div className="p-2 bg-amber-500 text-white rounded-lg shadow-sm group-hover:scale-105 transition-transform">
                          <Icon name="book-open" className="w-5 h-5" />
                        </div>
                        <span className="text-xs font-semibold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">Curriculum</span>
                      </div>
                      <p className="text-2xl font-bold text-slate-800 mt-3">{courses.length}</p>
                      <p className="text-xs font-medium text-slate-600">Active Courses</p>
                      <div className="mt-3 pt-2 border-t border-amber-100 flex items-center justify-between text-[11px] text-amber-700 font-medium">
                        <span>Manage & Assignments</span>
                        <Icon name="chevron-right" className="w-3 h-3" />
                      </div>
                    </div>

                    {/* Resource Cyan/Green Card */}
                    <div 
                      onClick={() => setActiveTab('resources')}
                      className="bg-emerald-50/70 border border-emerald-200/80 rounded-xl p-4 hover:shadow-md transition-all cursor-pointer group"
                    >
                      <div className="flex justify-between items-start">
                        <div className="p-2 bg-emerald-500 text-white rounded-lg shadow-sm group-hover:scale-105 transition-transform">
                          <Icon name="flask-conical" className="w-5 h-5" />
                        </div>
                        <span className="text-xs font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">Facilities</span>
                      </div>
                      <p className="text-2xl font-bold text-slate-800 mt-3">{resources.length}</p>
                      <p className="text-xs font-medium text-slate-600">Campus Facilities</p>
                      <div className="mt-3 pt-2 border-t border-emerald-100 flex items-center justify-between text-[11px] text-emerald-700 font-medium">
                        <span>Labs & Equipment</span>
                        <Icon name="chevron-right" className="w-3 h-3" />
                      </div>
                    </div>

                    {/* Activity Purple Card */}
                    <div 
                      onClick={() => setActiveTab('activities')}
                      className="bg-purple-50/70 border border-purple-200/80 rounded-xl p-4 hover:shadow-md transition-all cursor-pointer group"
                    >
                      <div className="flex justify-between items-start">
                        <div className="p-2 bg-purple-500 text-white rounded-lg shadow-sm group-hover:scale-105 transition-transform">
                          <Icon name="calendar" className="w-5 h-5" />
                        </div>
                        <span className="text-xs font-semibold text-purple-700 bg-purple-100 px-2 py-0.5 rounded-full">Events</span>
                      </div>
                      <p className="text-2xl font-bold text-slate-800 mt-3">{activities.length}</p>
                      <p className="text-xs font-medium text-slate-600">Campus Events</p>
                      <div className="mt-3 pt-2 border-t border-purple-100 flex items-center justify-between text-[11px] text-purple-700 font-medium">
                        <span>Schedule & Details</span>

                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-purple-600" /> Polymorphism</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-purple-600" /> Interfaces</li>
                      </ul>
                    </div>

                    {/* Layer 2: Data Processing Layer */}
                    <div className="bg-blue-50/70 border border-blue-200 rounded-xl p-5 shadow-sm">
                      <div className="p-2 bg-blue-600 text-white rounded-lg w-fit mb-3">
                        <Icon name="layers" className="w-5 h-5" />
                      </div>
                      <h4 className="font-bold text-slate-800 text-sm mb-1">2. Data Processing Layer</h4>
                      <p className="text-xs text-slate-500 mb-3">In-Memory Logic & Streams API</p>
                      <ul className="text-xs space-y-1.5 text-slate-700 font-medium">
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-blue-600" /> Collections Framework</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-blue-600" /> Java Streams API</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-blue-600" /> Generics</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-blue-600" /> File Handling (I/O)</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-blue-600" /> Lambda Expressions</li>
                      </ul>
                    </div>

                    {/* Layer 3: JDBC & CRUD Operations */}
                    <div className="bg-rose-50/70 border border-rose-200 rounded-xl p-5 shadow-sm">
                      <div className="p-2 bg-rose-600 text-white rounded-lg w-fit mb-3">
                        <Icon name="database" className="w-5 h-5" />
                      </div>
                      <h4 className="font-bold text-slate-800 text-sm mb-1">3. JDBC & CRUD Layer</h4>
                      <p className="text-xs text-slate-500 mb-3">Database Persistency API</p>
                      <ul className="text-xs space-y-1.5 text-slate-700 font-medium">
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-rose-600" /> DB Connection Driver</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-rose-600" /> INSERT Operations</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-rose-600" /> UPDATE Queries</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-rose-600" /> DELETE Statements</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-rose-600" /> RETRIEVE ResultSets</li>
                      </ul>
                    </div>

                    {/* Layer 4: Reports & Retrieval */}
                    <div className="bg-emerald-50/70 border border-emerald-200 rounded-xl p-5 shadow-sm">
                      <div className="p-2 bg-emerald-600 text-white rounded-lg w-fit mb-3">
                        <Icon name="file-text" className="w-5 h-5" />
                      </div>
                      <h4 className="font-bold text-slate-800 text-sm mb-1">4. Reports & Retrieval</h4>
                      <p className="text-xs text-slate-500 mb-3">Output Generation & Export</p>
                      <ul className="text-xs space-y-1.5 text-slate-700 font-medium">
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-emerald-600" /> View Analytics</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-emerald-600" /> Multi-criteria Search</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-emerald-600" /> Generate Performance Reports</li>
                        <li className="flex items-center gap-1.5"><Icon name="check" className="w-3.5 h-3.5 text-emerald-600" /> Audit Logging</li>
                      </ul>
                    </div>

                  </div>
                </div>
              )}

            </div>
          </main>

          {/* --- MODAL FORMS FOR CREATING RECORDS --- */}
          {modalType === 'addStudent' && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-slate-800 text-base">Add New Student Record</h3>
                  <button onClick={() => setModalType(null)} className="p-1 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleAddStudent} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Full Name</label>
                    <input 
                      type="text" required 
                      placeholder="e.g. Jordan Lee" 
                      value={newStudent.name}
                      onChange={(e) => setNewStudent({...newStudent, name: e.target.value})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Email</label>
                    <input 
                      type="email" required 
                      placeholder="jordan.l@campus.edu" 
                      value={newStudent.email}
                      onChange={(e) => setNewStudent({...newStudent, email: e.target.value})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Department</label>
                      <select 
                        value={newStudent.department}
                        onChange={(e) => setNewStudent({...newStudent, department: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800"
                      >
                        <option>Computer Science</option>
                        <option>Electrical Eng.</option>
                        <option>Mechanical Eng.</option>
                        <option>Biotechnology</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">GPA</label>
                      <input 
                        type="text" required 
                        value={newStudent.gpa}
                        onChange={(e) => setNewStudent({...newStudent, gpa: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800"
                      />
                    </div>
                  </div>
                  <div className="pt-3 flex justify-end space-x-2">
                    <button type="button" onClick={() => setModalType(null)} className="px-4 py-2 bg-slate-100 font-semibold rounded-lg text-slate-600">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-sm">Save to DB</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {modalType === 'addFaculty' && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-slate-800 text-base">Register Faculty Member</h3>
                  <button onClick={() => setModalType(null)} className="p-1 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleAddFaculty} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Faculty Name & Title</label>
                    <input 
                      type="text" required 
                      placeholder="e.g. Dr. Sarah Jenkins" 
                      value={newFaculty.name}
                      onChange={(e) => setNewFaculty({...newFaculty, name: e.target.value})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Email</label>
                    <input 
                      type="email" required 
                      placeholder="s.jenkins@campus.edu" 
                      value={newFaculty.email}
                      onChange={(e) => setNewFaculty({...newFaculty, email: e.target.value})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Specialization</label>
                    <input 
                      type="text" required 
                      placeholder="e.g. Distributed Systems" 
                      value={newFaculty.specialization}
                      onChange={(e) => setNewFaculty({...newFaculty, specialization: e.target.value})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800"
                    />
                  </div>
                  <div className="pt-3 flex justify-end space-x-2">
                    <button type="button" onClick={() => setModalType(null)} className="px-4 py-2
		    bg-slate-100 font-semibold rounded-lg text-slate-600">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-rose-600 text-white font-semibold rounded-lg shadow-sm">Save Faculty</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
